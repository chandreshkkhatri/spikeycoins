name: Deploy to Dev Server

on:
  push:
    branches: [development]
    paths:
      - 'web-server/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -e

            # Source profile and add common Node paths
            export PATH="$HOME/.local/share/pnpm:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -1)/bin:$HOME/.npm-global/bin:/usr/local/bin:$PATH"
            source ~/.bashrc 2>/dev/null || source ~/.profile 2>/dev/null || true

            echo "📦 Pulling latest code..."
            cd ~/deployments/dev/spikeycoins
            git fetch origin development
            git reset --hard origin/development
            cd web-server

            echo "📦 Installing dependencies..."
            pnpm install

            echo "🔨 Building..."
            pnpm build

            echo "🚀 Starting or restarting server..."
            if pm2 describe spikey-coins-backend >/dev/null 2>&1; then
              pm2 restart spikey-coins-backend --update-env
            else
              pm2 start dist/server.js --name spikey-coins-backend
            fi
            pm2 save

            echo "✅ Deployment complete!"
            pm2 status
